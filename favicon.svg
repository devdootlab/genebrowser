<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="An avocado half with a large pit">
  <title>Gene browser</title>
  <!-- Read at 16x16 in a tab, so this is three nested shapes and one highlight: dark skin, pale
       flesh, big pit. The pit fills a third of the icon on purpose; it is the only part still
       legible when the tab is not the active one.

       Two things this file has to get right that an HTML file does not.
       SVG is XML: a double hyphen inside a comment is a hard parse error, and a favicon that fails
       to parse is silently indistinguishable from no favicon at all. Written with em dashes for
       that reason, against the double hyphens used everywhere else in this repo.
       The three body shapes repeat the same path rather than sharing one via defs and use, because
       an SVG loaded as an image renders in a restricted mode where internal references have been
       unreliable across browsers. Three copies of 90 bytes is cheaper than an icon that works in
       some browsers only.

       Regenerate the PNG fallback after changing any of this: node scripts/make_favicon.mjs -->

  <path d="M32 4c9 0 15.5 9.5 16.5 20.5C49.5 41 42.5 60 32 60S14.5 41 15.5 24.5C16.5 13.5 23 4 32 4Z" fill="#3f6b34"/>
  <g transform="translate(32 32) scale(0.80) translate(-32 -32)">
    <path d="M32 4c9 0 15.5 9.5 16.5 20.5C49.5 41 42.5 60 32 60S14.5 41 15.5 24.5C16.5 13.5 23 4 32 4Z" fill="#cfe08d"/>
  </g>
  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <path d="M32 4c9 0 15.5 9.5 16.5 20.5C49.5 41 42.5 60 32 60S14.5 41 15.5 24.5C16.5 13.5 23 4 32 4Z" fill="#e6efb8"/>
  </g>

  <circle cx="32" cy="37" r="12.5" fill="#8a5a30"/>
  <circle cx="32" cy="37" r="11.7" fill="none" stroke="#6d4423" stroke-width="1.5"/>
  <circle cx="27.5" cy="32.5" r="4.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="27.5" cy="32.5" r="1.6" fill="#2b1a0d" opacity="0.55"/>
</svg>
